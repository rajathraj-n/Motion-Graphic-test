<!doctype html>
<html lang="en-US">
<head>
<meta charset="utf-8">
<title>RackNap Easy — Product Launch (90s)</title>
<style>
:root{--o:#F06023;--y:#FFD600;--ink:#1E2227;--ink2:#3A3F45;--mut:#6B7178;--mut2:#9AA0A6;--line:#E5E7EB;--bg:#F4F5F7;--card:#fff;
  --ok:#2E8B57;--okbg:#E8F5EE;--warn:#B7791F;--warnbg:#FFF6DB;--bad:#D64545;--badbg:#FDECEC;--info:#3B6FD8;--infobg:#EAF1FD}
*{box-sizing:border-box}
html,body{margin:0;background:#fff;overflow:hidden}
#stage{position:relative;width:1920px;height:1080px;overflow:hidden;font-family:Inter,sans-serif;color:var(--ink);
  background:radial-gradient(1400px 900px at 55% 42%,#FFFFFF 0%,#F7F8FA 45%,#ECEEF1 100%)}
#bgfx{position:absolute;inset:-60px;pointer-events:none}
#bgfx .dots{position:absolute;inset:0;background-image:radial-gradient(circle at 1px 1px,rgba(30,34,39,.10) 1px,transparent 1.4px);background-size:36px 36px;
  -webkit-mask-image:radial-gradient(1100px 700px at 55% 50%,#000 0%,transparent 75%);mask-image:radial-gradient(1100px 700px at 55% 50%,#000 0%,transparent 75%)}
#bgfx .glow{position:absolute;border-radius:50%}
#world{position:absolute;inset:0;perspective:2400px;perspective-origin:50% 46%}
#cam{position:absolute;left:0;top:0;width:1px;height:1px;transform-style:preserve-3d;transform-origin:0 0}
.w3{position:absolute;left:0;top:0;transform-style:preserve-3d}
.abs{position:absolute;left:0;top:0}

/* ===================== UI skin (shared by the app and extracted panels) ===================== */
.ui{font:13px/1.5 Inter,sans-serif;color:var(--ink)}
.ui h1{font:600 30px/1.15 "Inter Display",Inter;letter-spacing:-.02em;margin:0}
.ui h2{font:600 16px/1.3 Inter;margin:0}
.ui h3{font:600 16px/1.35 Inter;margin:0}
.ui p{margin:0}
.ui small{display:block;font-size:10px;color:var(--mut2);margin-top:2px;font-weight:400}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid #DDE1E6;background:#fff;border-radius:7px;padding:9px 14px;font:600 11px/1 Inter;color:var(--ink);white-space:nowrap}
.btn.primary{background:var(--o);border-color:var(--o);color:#fff}
.btn.hov{background:#F6F7F9}.btn.primary.hov{background:#DB5216}
.btn.press{transform:scale(.97)}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:20px;padding:4px 10px;font:600 10px/1 Inter;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.ok{color:var(--ok);background:var(--okbg)}.pill.warn{color:var(--warn);background:var(--warnbg)}.pill.bad{color:var(--bad);background:var(--badbg)}.pill.info{color:var(--info);background:var(--infobg)}
.vmark{display:inline-grid;grid-template-columns:6px 6px;gap:1.5px;margin-right:8px;vertical-align:-2px}
.vmark i{width:6px;height:6px;display:block}.vmark i:nth-child(1){background:#F25022}.vmark i:nth-child(2){background:#7FBA00}.vmark i:nth-child(3){background:#00A4EF}.vmark i:nth-child(4){background:#FFB900}

.app{position:absolute;left:0;top:0;width:1600px;height:1000px;border-radius:16px;overflow:hidden;background:var(--bg);display:grid;grid-template-columns:240px 1fr;
  box-shadow:0 0 0 1px rgba(30,34,39,.08),0 40px 90px -30px rgba(30,34,39,.35),0 18px 36px -18px rgba(30,34,39,.22)}
.sb{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}
.sb-brand{height:88px;display:flex;align-items:center;padding:0 22px;border-bottom:1px solid var(--line)}
.sb-brand img{width:150px}
.sb-ws{display:flex;gap:10px;align-items:center;margin:16px 14px;padding:12px;border:1px solid var(--line);border-radius:10px}
.sb-ws strong{display:block;font-size:12px}.sb-ws span{font-size:10px;color:var(--mut2)}
.mono{width:32px;height:32px;border-radius:8px;background:#F1F2F4;display:grid;place-items:center;font:700 11px Inter;color:var(--ink2);flex:none}
.sb-label{font:600 9px/1 Inter;letter-spacing:.2em;color:var(--mut2);margin:14px 22px 8px}
.sb-nav{position:relative;padding:0 12px}
.sb-nav a{position:relative;z-index:1;display:flex;align-items:center;gap:12px;height:40px;padding:0 12px;border-radius:9px;font:500 12.5px Inter;color:var(--ink2)}
.sb-nav a.on{color:var(--o);font-weight:600}
.sb-nav .ico{width:16px;text-align:center;color:var(--mut2)}.sb-nav a.on .ico{color:var(--o)}
.sb-active{position:absolute;left:12px;right:12px;height:40px;border-radius:9px;background:#FFF1EA;top:0}
.badge{margin-left:auto;font:700 9px/1 Inter;background:#FFE9DE;color:var(--o);border-radius:10px;padding:3px 7px}
.main{position:relative;display:flex;flex-direction:column;min-width:0}
.top{height:64px;flex:none;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.crumb{font-size:12px;color:var(--mut2)}.crumb span{margin:0 8px}.crumb strong{color:var(--ink);font-weight:600}
.top-r{display:flex;align-items:center;gap:14px}
.avatar{width:32px;height:32px;border-radius:50%;background:#FFE9DE;color:var(--o);display:grid;place-items:center;font:700 10px Inter}
.qchip{font:600 11px Inter;color:var(--ink2);border:1px solid var(--line);border-radius:20px;padding:7px 12px;background:#fff}
.qchip b{display:inline-block;min-width:18px;text-align:center;margin-left:6px;background:var(--o);color:#fff;border-radius:10px;padding:2px 6px;font-size:10px}
.panes{position:relative;flex:1}
.pane{position:absolute;inset:0;padding:30px 36px;opacity:0}
.ph{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:22px}.ph p{color:var(--mut);margin-top:8px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:18px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px 20px}
.kpi span{display:block;font-size:11px;color:var(--mut)}
.kpi strong{display:block;font:600 30px/1.1 "Inter Display";letter-spacing:-.02em;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.kpi small{font-size:10px}
.kpi.alert{background:#FFF8F3;border-color:#FAD8C4}.kpi.alert strong{color:var(--o)}
.cols{display:grid;grid-template-columns:1.6fr 1fr;gap:16px}
.panel{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel-h{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line)}
.panel-h small{font:600 9px Inter;letter-spacing:.14em}
.issue{display:flex;gap:14px;padding:18px 20px}.issue-ico{width:36px;height:36px;border-radius:9px;background:#FFF1EA;color:var(--o);display:grid;place-items:center;flex:none}
.issue strong{font-size:13px}.issue p{color:var(--mut);font-size:12px;margin:6px 0 8px}.issue a{color:var(--o);font:600 11px Inter}
.istats{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line)}.istats div{padding:14px 20px;border-right:1px solid var(--line)}
.istats span{font:600 9px Inter;letter-spacing:.14em;color:var(--mut2)}.istats strong{display:block;font:600 22px "Inter Display";margin-top:4px}
.act{list-style:none;margin:0;padding:8px 20px}.act li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);font-size:12px}.act li:last-child{border:0}
.act li i{width:8px;height:8px;border-radius:50%;background:var(--o);margin-top:5px;flex:none}
.tbl .tr{display:grid;align-items:center;padding:14px 20px;border-bottom:1px solid var(--line);font-size:12px;gap:12px}
.tbl.t5 .tr{grid-template-columns:1.3fr 1.4fr 1fr .9fr .8fr}.tbl.t6 .tr{grid-template-columns:2fr 1.3fr .8fr .9fr .9fr .7fr}
.tbl .th{font:600 10px Inter;color:var(--mut2);padding:12px 20px;background:#FAFBFC}
.tbl .tr:last-child{border-bottom:0}
.tbl strong{font-weight:600}.num{font-variant-numeric:tabular-nums}
.tbl.compact .tr{padding:12px 20px}
.cat-ctl{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}
.search{width:300px;height:38px;border:1px solid var(--line);border-radius:8px;background:#fff;display:flex;align-items:center;gap:10px;padding:0 12px;color:var(--mut2)}
.search em{font-style:normal;font-size:12px}.search em.typed{color:var(--ink)}
.chips{display:flex;gap:8px}.chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:7px 14px;font:500 11px Inter;color:var(--mut)}
.chip.on{background:#FFF1EA;border-color:#F9CDB5;color:var(--o);font-weight:600}.chip.hov{border-color:#CDD2D8;color:var(--ink2)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.pc{background:#fff;border:1px solid var(--line);border-radius:12px;padding:20px;display:flex;flex-direction:column;height:262px}
.pv{font-size:10px;color:var(--mut)}.pc h3{margin:12px 0 8px;min-height:44px;max-width:250px}.pc p{font-size:11px;color:var(--mut2);line-height:1.6}
.pp{margin-top:auto;display:flex;align-items:baseline;gap:6px}.pp strong{font:600 28px "Inter Display";letter-spacing:-.02em}.pp span{font-size:10px;color:var(--mut2)}
.pc .btn{margin-top:12px}.pd{display:flex;justify-content:space-between;font-size:9.5px;color:var(--mut2);border-top:1px solid var(--line);margin-top:12px;padding-top:10px}
.pc.hov{border-color:#F9CDB5;box-shadow:0 14px 34px -12px rgba(240,96,35,.28)}
.legend{font-size:10px;color:var(--mut)}.legend i{display:inline-block;width:8px;height:8px;border-radius:2px;margin:0 5px 0 12px}.legend .r{background:var(--o)}.legend .c{background:#C9CED4}
.bars{padding:16px 20px}.bar{display:grid;grid-template-columns:150px 1fr 70px;align-items:center;gap:12px;margin:12px 0;font-size:11.5px}
.bar .trk{position:relative;height:22px}.bar .rv,.bar .cs{position:absolute;left:0;height:10px;border-radius:5px}.bar .rv{top:0;background:var(--o)}.bar .cs{top:12px;background:#C9CED4}
.bar b{text-align:right;font-variant-numeric:tabular-nums}

/* ---------- floating panels ---------- */
.fp{position:absolute;left:0;top:0;background:#fff;border:1px solid var(--line);border-radius:14px;
  box-shadow:0 30px 70px -24px rgba(30,34,39,.30),0 10px 22px -12px rgba(30,34,39,.18);transform-origin:50% 50%;will-change:transform,opacity}
.fp .hd{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.fp .eyb{font:700 9.5px/1 Inter;letter-spacing:.18em;color:var(--o)}
.lbl{font:600 9px/1 Inter;letter-spacing:.16em;color:var(--mut2);text-transform:uppercase}

/* ---------- chaos fragments ---------- */
.frag{position:absolute;left:0;top:0;background:#fff;border:1px solid #DADDE2;border-radius:10px;overflow:hidden;
  box-shadow:0 24px 50px -22px rgba(30,34,39,.35);transform-origin:50% 50%;will-change:transform,opacity}
.frag .bar{all:unset}
.frag .tb{height:30px;background:#F1F2F4;border-bottom:1px solid #DADDE2;display:flex;align-items:center;gap:6px;padding:0 10px;font:600 10px Inter;color:var(--ink2)}
.frag .tb i{width:8px;height:8px;border-radius:50%;background:#D2D5DA;display:block}
.frag .tb .t{margin-left:8px}
.xl{display:grid;font:11px/1 Inter;color:var(--ink2)}
.xl div{border-right:1px solid #E6E8EB;border-bottom:1px solid #E6E8EB;padding:7px 8px;white-space:nowrap;overflow:hidden}
.xl .h{background:#F7F8F9;color:var(--mut);font-weight:600}
.xl .rh{background:#F7F8F9;color:var(--mut2);text-align:center}
.xl .err{background:#FDECEC;color:var(--bad);font-weight:700}
.doc{padding:18px 20px;font-size:11px;color:var(--ink2)}
.doc .dt{font:700 18px "Inter Display";color:var(--ink)}
.doc .ln{display:flex;justify-content:space-between;border-top:1px solid #EEF0F2;padding:7px 0}
.warnchip{display:inline-flex;gap:6px;align-items:center;background:#FDECEC;color:var(--bad);font:700 10px Inter;border-radius:6px;padding:5px 8px}

/* ---------- HUD ---------- */
#hudbg{position:absolute;left:-200px;top:-260px;width:1500px;height:760px;pointer-events:none;
  background:radial-gradient(closest-side,rgba(255,255,255,.96),rgba(255,255,255,.88) 45%,rgba(255,255,255,0))}
#hud{position:absolute;inset:0;pointer-events:none}
.hl{position:absolute;left:120px;top:96px;visibility:hidden}
.hl .eb{display:flex;align-items:center;gap:14px;font:700 14px/1 Inter;letter-spacing:.24em;color:var(--o);margin-bottom:18px}
.hl .eb .bar{width:40px;height:3px;background:var(--o);transform-origin:0 50%;border-radius:2px}
.hl .eb .tx{overflow:hidden;display:block}.hl .eb .tx span{display:block}
.hl h2{margin:0;font:600 64px/1.04 "Inter Display";letter-spacing:-.03em;color:var(--ink)}
.hl h2 .w{display:inline-block;overflow:hidden;vertical-align:top;padding-bottom:.1em;margin-bottom:-.1em}
.hl h2 .w span{display:inline-block}
.hl h2 em{font-style:normal;color:var(--o)}
.kin{position:absolute;font:700 92px/1 "Inter Display";letter-spacing:-.035em;color:var(--ink);white-space:nowrap}
.kin em{font-style:normal;color:var(--o)}
#logoReveal{position:absolute;left:50%;top:50%;width:760px;margin-left:-380px;margin-top:-150px;text-align:center}
#logoReveal img{width:760px;display:block}
#logoReveal .tg{margin-top:28px;font:500 30px/1.3 Inter;color:var(--ink2);letter-spacing:-.005em;overflow:hidden}
#logoReveal .tg span{display:block}
#sweep{position:absolute;top:-20%;bottom:-20%;width:900px;left:0;pointer-events:none;mix-blend-mode:multiply;opacity:0;
  background:linear-gradient(100deg,rgba(240,96,35,0) 0%,rgba(240,96,35,.10) 38%,rgba(255,214,0,.26) 50%,rgba(240,96,35,.10) 62%,rgba(240,96,35,0) 100%)}
#sweepL{position:absolute;top:-20%;bottom:-20%;width:300px;left:0;pointer-events:none;opacity:0;
  background:linear-gradient(100deg,rgba(255,255,255,0) 0%,rgba(255,255,255,.85) 50%,rgba(255,255,255,0) 100%)}
#final{position:absolute;inset:0;visibility:hidden}
#final .logo{position:absolute;left:50%;top:290px;width:560px;margin-left:-280px}
#final .tag{position:absolute;left:0;right:0;top:560px;text-align:center;font:600 64px/1.1 "Inter Display";letter-spacing:-.03em}
#final .tag .ph2{display:inline-block;overflow:hidden;vertical-align:top;margin:0 14px;padding-bottom:.12em}
#final .tag .ph2 span{display:inline-block}
#final .tag em{font-style:normal;color:var(--o)}
#final .cta{position:absolute;left:50%;top:720px;transform:translateX(-50%);display:inline-flex;align-items:center;gap:14px;height:76px;padding:0 40px;border-radius:40px;
  background:var(--o);color:#fff;font:600 28px Inter;box-shadow:0 20px 50px -16px rgba(240,96,35,.6);white-space:nowrap}
#final .cta i{display:block;width:12px;height:12px;border-radius:50%;background:var(--y)}
#final .uline{position:absolute;left:50%;top:812px;width:380px;margin-left:-190px;height:4px;border-radius:2px;background:var(--y);transform-origin:0 50%}
#cursor{position:absolute;left:0;top:0;width:28px;height:28px;transform-origin:4px 3px;pointer-events:none;filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
#cursor svg{position:absolute;left:0;top:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 90% 90% at 50% 48%,transparent 60%,rgba(30,34,39,.16) 100%)}
#grain{position:absolute;inset:0;pointer-events:none;opacity:.035;mix-blend-mode:multiply;background:url(assets/grain-tile.png);background-size:128px 128px}
#tension{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 80% 80% at 50% 50%,transparent 40%,rgba(30,34,39,.22) 100%);opacity:0}
</style>
</head>
<body>
<div id="stage">
  <div id="bgfx"><div class="dots"></div>
    <div class="glow" id="glowO" style="left:1180px;top:-260px;width:1100px;height:800px;background:radial-gradient(closest-side,rgba(240,96,35,.10),transparent)"></div>
    <div class="glow" id="glowY" style="left:-300px;top:560px;width:1000px;height:700px;background:radial-gradient(closest-side,rgba(255,214,0,.10),transparent)"></div>
  </div>
  <div id="world"><div id="cam">
    <div class="w3" id="chaos"></div>
    <div class="w3" id="appwrap"></div>
    <div class="w3" id="floaters"></div>
    <div id="cursor">
      <svg id="cur-arrow" width="28" height="28" viewBox="0 0 28 28"><path d="M4 2.5v19.2l5.1-4.6 3.3 7.6 3.4-1.5-3.3-7.4h6.9z" fill="#fff" stroke="#1E2227" stroke-width="1.4" stroke-linejoin="round"/></svg>
      <svg id="cur-hand" width="28" height="28" viewBox="0 0 28 28" style="opacity:0"><path d="M10.2 3.2c-1 0-1.8.8-1.8 1.8v10.2l-1.5-1.6c-.8-.8-2-.8-2.7-.1-.7.7-.7 1.8 0 2.6l4.6 5.5c1.4 1.7 3.1 2.6 5.3 2.6h2.2c3.4 0 5.7-2.5 5.7-5.9v-5.6c0-1-.8-1.7-1.7-1.7-.5 0-.9.2-1.2.5v-.4c0-1-.8-1.7-1.7-1.7-.5 0-1 .2-1.3.6-.2-.8-.9-1.4-1.7-1.4-.4 0-.8.1-1.1.4V5c0-1-.8-1.8-1.8-1.8z" fill="#fff" stroke="#1E2227" stroke-width="1.3" stroke-linejoin="round"/></svg>
    </div>
  </div></div>
  <div id="tension"></div>
  <div id="hudbg"></div>
  <div id="hud"></div>
  <div id="sweep"></div><div id="sweepL"></div>
  <div id="final">
    <img class="logo" src="assets/logo.png" alt="RackNap Easy">
    <div class="tag"><span class="ph2"><span>Sell <em>smarter.</em></span></span><span class="ph2"><span>Operate <em>simpler.</em></span></span><span class="ph2"><span>Grow <em>faster.</em></span></span></div>
    <div class="cta"><i></i>Discover RackNap Easy</div>
    <div class="uline"></div>
  </div>
  <div id="vig"></div>
  <div id="grain"></div>
</div>
<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script src="js/core.js"></script>
<script src="js/scenes.js"></script>
</body>
</html>
